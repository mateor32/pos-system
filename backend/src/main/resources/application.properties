spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pos_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pos_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:pos-system-super-secret-key-2024-must-be-256-bits-long-enough}
jwt.expiration=86400000

server.port=${PORT:8080}

logging.level.com.pos=INFO
