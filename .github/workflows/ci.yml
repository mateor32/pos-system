name: CI/CD — POS System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Backend — Compilar y ejecutar pruebas unitarias
  # ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 17 + Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compilar y ejecutar tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Frontend — Verificar TypeScript y build de producción
  # ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node.js + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Type-check TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build de producción
        working-directory: frontend
        run: npm run build

      - name: Publicar artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Resumen — Solo corre si ambos jobs pasaron
  # ─────────────────────────────────────────────────────────────────
  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: success()

    steps:
      - name: Todo OK
        run: echo "✅ Backend tests y Frontend build completados exitosamente."
