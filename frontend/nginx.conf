# Nginx sirve los archivos estáticos y redirige /api al backend.
# Esta configuración reemplaza el proxy de Vite que solo funciona en desarrollo.

server {
    listen 80;

    # Sirve los archivos del build de React
    root /usr/share/nginx/html;
    index index.html;

    # Cualquier ruta que no sea un archivo real la manda a index.html
    # (necesario para que React Router funcione con F5/reload)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso: /api/* → backend:8080
    # "backend" es el nombre del servicio en docker-compose
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
